name: CI
on: [push, pull_request]

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}
